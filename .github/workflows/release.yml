# Windows 版构建发布：推送 v* tag 自动触发，也可在 Actions 页面手动运行
# tag 含 -alpha 时构建 alpha 版（预发布），否则构建 stable 版；产物为 Release 草稿
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.0.9 或 v1.0.9-alpha.1'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect edition
        id: edition
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "edition=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_name=ClaudeDeck Alpha $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=--config src-tauri/tauri.alpha.conf.json" >> $GITHUB_OUTPUT
          else
            echo "edition=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=ClaudeDeck $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION: ${{ steps.edition.outputs.edition }}
        with:
          tagName: ${{ steps.edition.outputs.tag }}
          releaseName: ${{ steps.edition.outputs.release_name }}
          releaseBody: '下载对应的安装包（.exe 或 .msi）安装即可。'
          releaseDraft: true
          prerelease: ${{ steps.edition.outputs.prerelease == 'true' }}
          args: ${{ steps.edition.outputs.extra_args }}
